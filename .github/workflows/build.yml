name: build

on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Core tests
        working-directory: Core
        run: swift test

      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project ESP.xcodeproj -scheme ESP -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            BUILD_NUMBER=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | xcbeautify --renderer github-actions

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ESP.app Payload/
          zip -qry ESP.ipa Payload
          ls -lh ESP.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ESP-ipa
          path: ESP.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
