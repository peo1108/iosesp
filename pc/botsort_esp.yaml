# BoT-SORT tuned for offline ESP videos: keeps people through ~3 s of occlusion, re-identifies them by
# appearance (features from the detector itself), compensates for a panning phone.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 90
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: auto
