name: ESP
options:
  bundleIdPrefix: com.cam
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  ESPCore:
    path: Core
targets:
  ESP:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Models/**"
      # Compiled CoreML models produced by tools/export-models.py in CI, copied as a folder.
      - path: App/Models
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: ESPCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cam.espcamera
        PRODUCT_NAME: ESP
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        BUILD_NUMBER: "1"
        CURRENT_PROJECT_VERSION: "$(BUILD_NUMBER)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
schemes:
  ESP:
    build:
      targets:
        ESP: all
